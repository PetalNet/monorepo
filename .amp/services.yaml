services:
  grove-oidc:
    port: 8080
    command: >-
      set -o pipefail;
      mkdir -p .amp/in;
      touch .amp/in/grove-oidc.log;
      GROVE_MCP_CLIENT_SECRET='grove-mcp-development-only-secret' node apps/grove/dev-oidc.mjs 2>&1 | tee -a .amp/in/grove-oidc.log
    portal:
      title: Grove development OIDC
      description: Automatic operator sign-in for the Grove orb demo.
  grove:
    command: >-
      set -o pipefail;
      mkdir -p .amp/in;
      touch .amp/in/grove.log .amp/in/grove-browser.log;
      docker inspect grove-postgres >/dev/null 2>&1 || docker run --detach --name grove-postgres --restart unless-stopped --env POSTGRES_USER=grove --env POSTGRES_PASSWORD=grove --env POSTGRES_DB=grove --publish 127.0.0.1:54320:5432 postgres:17-alpine;
      docker start grove-postgres >/dev/null;
      until docker exec grove-postgres pg_isready --username grove --dbname grove >/dev/null 2>&1; do sleep 1; done;
      until curl --fail --silent http://127.0.0.1:8080/ >/dev/null; do sleep 1; done;
      until test -s .amp/portals/grove-oidc.json; do sleep 1; done;
      export GROVE_BROWSER_LOG_PATH="$PWD/.amp/in/grove-browser.log";
      cd apps/grove && export DATABASE_URL='postgresql://grove:grove@127.0.0.1:54320/grove' BETTER_AUTH_URL="$(printf %s "$PUBLIC_URL" | sed 's#/$##')" BETTER_AUTH_SECRET='grove-orb-development-only-secret' GROVE_ORB_DEV_AUTH='1' GROVE_OIDC_ISSUER="$(node -e 'const manifest = JSON.parse(require("node:fs").readFileSync("../../.amp/portals/grove-oidc.json", "utf8")); process.stdout.write(manifest.links[0].url.replace(/\/$/, "") + "/realms/grove")')" GROVE_OIDC_CLIENT_ID='grove-browser-development' GROVE_OIDC_CLIENT_SECRET='grove-browser-development-secret' GROVE_HOME_OWNER_ISSUER="$(node -e 'const manifest = JSON.parse(require("node:fs").readFileSync("../../.amp/portals/grove-oidc.json", "utf8")); process.stdout.write(manifest.links[0].url.replace(/\/$/, "") + "/realms/grove")')" GROVE_HOME_OWNER_SUBJECT='operator-development' GROVE_MCP_ISSUER="$(node -e 'const manifest = JSON.parse(require("node:fs").readFileSync("../../.amp/portals/grove-oidc.json", "utf8")); process.stdout.write(manifest.links[0].url.replace(/\/$/, "") + "/realms/grove-mcp")')" GROVE_MCP_JWKS_URL="$(node -e 'const manifest = JSON.parse(require("node:fs").readFileSync("../../.amp/portals/grove-oidc.json", "utf8")); process.stdout.write(manifest.links[0].url.replace(/\/$/, "") + "/realms/grove-mcp/jwks")')" GROVE_MCP_RESOURCE="$(printf %s "$PUBLIC_URL" | sed 's#/$##')" GROVE_MCP_CLIENT_SECRET='grove-mcp-development-only-secret' __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS="$(printf %s "$PUBLIC_URL" | sed -E 's#^https?://##; s#/$##')" && { vp exec effectdb migrate up && vp exec vite dev --host 0.0.0.0 --port "$PORT"; } 2>&1 | tee -a ../../.amp/in/grove.log
    portal:
      title: Grove
      description: Effect domain demo; agent controls are discoverable at /__dev.
