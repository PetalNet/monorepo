[project]
name = "janet-phone"
version = "0.1.0"
description = "A phone call to Janet: caller audio on one WebSocket, a voice head conversation behind it"
requires-python = ">=3.13"
dependencies = ["janet-line", "janet-turn", "numpy>=2.1.3", "qrcode>=8,<9", "websockets>=15,<17"]

[project.optional-dependencies]
matrix = ["matrix-nio[e2e]"]

[project.scripts]
janet-phone = "janet_phone:main"
janet-ring = "janet_ring:main"

[tool.ruff]
line-length = 120

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
  "barge_in",
  "janet_phone",
  "janet_ring",
  "matrix_notice",
  "opus_transport",
  "pairing",
  "resumable",
  "ringing",
  "speech_stream",
]

[dependency-groups]
dev = ["pytest>=8,<10"]
