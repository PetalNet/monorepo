[project]
name = "janet-voice-note"
version = "0.1.0"
description = "Transcribe a recorded voice note and speak a reply through the voice system's Wyoming servers"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
janet-voice-note = "janet_voice_note:main"

[tool.ruff]
line-length = 120

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["janet_voice_note"]
