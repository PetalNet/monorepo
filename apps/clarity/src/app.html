<!doctype html>
<html lang="en" data-theme="light">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0d0c0b" media="(prefers-color-scheme: dark)" />

		<!-- Clarity mark. Without this the browser probes /favicon.ico, which traefik
	     routes to SearXNG (the /favicon* rule) — so every tab would show SearXNG's
	     icon instead of Clarity's (parity with app/web/index.html). -->
		<link rel="icon" href="/icon.svg" />
		<link
			rel="search"
			type="application/opensearchdescription+xml"
			title="Clarity"
			href="/opensearch.xml"
		/>

		<!-- Anti-FOUC: resolve + apply the saved/OS theme synchronously before first
		     paint so a dark visitor never flashes light. Clarity theme keys are
		     light / dark / auto stored in 'clarity-theme' (mirrors app.ts). -->
		<script>
			(function () {
				try {
					var t = localStorage.getItem("clarity-theme") || "auto";
					var d =
						t === "dark" ||
						(t === "auto" &&
							window.matchMedia &&
							window.matchMedia("(prefers-color-scheme: dark)").matches);
					document.documentElement.setAttribute("data-theme", d ? "dark" : "light");
				} catch (e) {}
			})();
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
