[project]
name = "janet-voice-gateway"
version = "0.1.0"
description = "One authenticated HTTP door to the voice head and a Wyoming voice, with Wake-on-LAN"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
janet-voice-gateway = "janet_voice_gateway:main"

[tool.ruff]
line-length = 120

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["janet_voice_gateway"]

[dependency-groups]
dev = ["pytest>=8,<10"]
