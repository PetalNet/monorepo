services:
  relics:
    image: relics:${MONOREPO_SHA:?Set a main commit SHA}
    build:
      context: ../..
      dockerfile: apps/relics/Dockerfile
      args:
        MONOREPO_SHA: ${MONOREPO_SHA}
    container_name: relics-monorepo
    restart: unless-stopped
    env_file: .env
    environment:
      ORIGIN: https://relics.petalcat.dev
      ADDRESS_HEADER: x-forwarded-for
      XFF_DEPTH: 1
    ports:
      - 127.0.0.1:48218:4173
    volumes:
      - ${RELICS_DATA_DIR:?Set the private data directory}:/app/data
    mem_limit: 512m
