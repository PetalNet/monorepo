# Deploy from a checkout of main after building the image there:
#   docker build -f apps/tasks/Dockerfile --build-arg MONOREPO_SHA="$SHA" -t "tasks:$SHA" .
#   MONOREPO_SHA="$SHA" docker compose --env-file /path/to/tasks.env -f apps/tasks/compose.yaml up -d
# See .env.example for the variables and config.example.json for TASKS_CONFIG.
name: tasks
services:
  tasks:
    mem_limit: 512m
    memswap_limit: 512m
    image: tasks:${MONOREPO_SHA:?Set the monorepo SHA the image was built from}
    container_name: tasks
    user: "1000:1000"
    restart: unless-stopped
    ports: ["127.0.0.1:${TASKS_PORT:-8896}:8896"]
    environment:
      PORT: 8896
      BODY_SIZE_LIMIT: 4M
      ORIGIN: ${ORIGIN:?Set the public origin}
      TASKS_DB_PATH: /data/tasks.db
      TASKS_CONFIG: /data/config.json
      ALLOW: ${ALLOW:?Set the allowed users}
      TASKS_AGENTS_INGEST_TOKEN: ${TASKS_AGENTS_INGEST_TOKEN:-}
      TZ: ${TZ:-UTC}
      GLITCHTIP_DSN: ${GLITCHTIP_DSN:-}
      GLITCHTIP_ENV: ${GLITCHTIP_ENV:-}
      PUBLIC_GLITCHTIP_DSN: ${PUBLIC_GLITCHTIP_DSN:-}
      PUBLIC_GLITCHTIP_ENV: ${PUBLIC_GLITCHTIP_ENV:-}
      GLITCHTIP_DEBUG: ${GLITCHTIP_DEBUG:-}
      # Where answers from published pages are announced: an unencrypted room the bot has joined.
      MATRIX_HOMESERVER: ${MATRIX_HOMESERVER:-}
      MATRIX_ROOM: ${MATRIX_ROOM:-}
      MATRIX_TOKEN_FILE: /run/matrix-token
      # What's ongoing: a GitHub search for open pull requests, read with a read-only token.
      GITHUB_PULLS_SEARCH: ${GITHUB_PULLS_SEARCH:-}
      GITHUB_TOKEN_FILE: /run/github-token
    volumes:
      - "${TASKS_DATA_DIR:?Set the Tasks data directory}:/data"
      - "${MATRIX_TOKEN_FILE_HOST:-/dev/null}:/run/matrix-token:ro"
      - "${GITHUB_TOKEN_FILE_HOST:-/dev/null}:/run/github-token:ro"
    networks: [tasks]
    logging: { driver: json-file, options: { max-size: "1m", max-file: "1" } }
networks:
  # A host whose Docker address pools are exhausted can pin a subnet in a compose override.
  tasks: {}
