services:
  astrolabe:
    build:
      context: ../..
      dockerfile: apps/astrolabe/Dockerfile
    ports:
      - "4731:3000"
    environment:
      LAB_LAT: ${LAB_LAT:-51.4769}
      LAB_LON: ${LAB_LON:--0.0005}
      USAGE_PATH: /shared/janet-usage.json
      CODEX_USAGE_PATH: /shared/codex-usage.json
      BACKUP_LOG: /logs/backup-offsite.log
      KUMA_DB: /kuma/kuma.db
      HOST_HEALTH_PATH: /shared/host-health-state.json
      MOOD_PATH: /shared/janet-mood.json
    volumes:
      - /home/docker/.claude/shared/janet-usage.json:/shared/janet-usage.json:ro
      - /home/docker/.claude/shared/codex-usage.json:/shared/codex-usage.json:ro
      - /home/docker/.claude/shared/host-health-state.json:/shared/host-health-state.json:ro
      - /tmp/janet-mood.json:/shared/janet-mood.json:ro
      - /home/docker/backup-offsite.log:/logs/backup-offsite.log:ro
      - /var/lib/docker/volumes/uptime-kuma_uptime-kuma-data/_data:/kuma:ro
