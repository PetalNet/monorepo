[project]
name = "chatterbox-wyoming"
version = "0.1.0"
description = "Wyoming TTS server for a Chatterbox Turbo voice runtime"
requires-python = ">=3.12"
# torch and the voice runtime's own packages come from the runtime environment (see README).
dependencies = ["numpy", "scipy", "soundfile", "wyoming>=1.8,<2", "audiotsm==0.1.2"]

[project.scripts]
chatterbox-wyoming = "chatterbox_wyoming:main"

[tool.setuptools]
py-modules = ["chatterbox_wyoming", "resident_voice"]

[tool.ruff]
line-length = 120

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
# Captured tracebacks keep the failed model alive during the unload test.
addopts = "-p no:logging"
