[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Game/EnvGen/Maps/Site
EditorStartupMap=/Game/EnvGen/Maps/Site
GlobalDefaultGameMode=/Script/EnvGen.EnvGenGameMode

[/Script/Engine.RendererSettings]
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.HardwareRayTracing=False
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=True
r.AllowStaticLighting=False
r.SupportSkyAtmosphereAffectsHeightFog=True
; Exposure limits on post-process volumes are EV100 only with this on.
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
; Segmentation cameras read stencil IDs from custom depth.
r.CustomDepth=3
; The engine's sample trees keep their leaves in Nanite assemblies, which only draw with this on.
r.Nanite.Foliage=True
; The survey orthophoto's ratio is a virtual texture: a centimetre a pixel over the survey's footprint.
r.VirtualTextures=True

[SystemSettings]
; Grass maps are made while the game runs, not kept in the level: the level is regenerated, never cooked.
grass.GrassMap.UseRuntimeGeneration=1
; Keep the texture pool well under the card's free memory; other programs may need the rest.
r.Streaming.PoolSize=1500
; Nanite geometry kept on the card, in MB. The engine commits its default 512 up front; the trees
; draw the same at the fixed stations with 128.
r.Nanite.Streaming.StreamingPoolSize=128
; Virtual shadow map pages kept on the card: 4096 pages are 512 MB. At 2048 the card peaked 280 MB lower in the
; fly tour (7630 to 7350 MiB) and the stations' shadows read the same.
r.Shadow.Virtual.MaxPhysicalPages=2048
; Directional shadows use one less resolution level; fixed-camera quality and paired timing are checked together.
r.Shadow.Virtual.ResolutionLodBiasDirectional=-0.5

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6
