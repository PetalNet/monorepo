# Deploy from a checkout of main after building the image there:
#   docker build -f apps/chaos/Dockerfile --build-arg MONOREPO_SHA="$SHA" -t "chaos:$SHA" .
#   MONOREPO_SHA="$SHA" docker compose -f apps/chaos/compose.yaml up -d
name: chaos
services:
  chaos:
    image: chaos:${MONOREPO_SHA:?Set the monorepo main SHA the image was built from}
    container_name: chaos
    restart: unless-stopped
    network_mode: bridge
    # Loopback only: the reverse proxy on the host is the way in, and it decides who may read.
    ports:
      - "127.0.0.1:4466:3000"
    volumes:
      - chaos-data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
volumes:
  chaos-data:
    name: chaos-data
