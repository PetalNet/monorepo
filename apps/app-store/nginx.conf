server {
	listen 80;
	root /srv;

	# The lab's public repo (Point and friends). No login.
	location /repo/ {
	}

	# Parker's own apps. F-Droid clients send the login from the repo URL.
	location /store/ {
		auth_basic "Parker's Apps";
		auth_basic_user_file /etc/nginx/htpasswd;
	}

	location / {
		return 404;
	}
}
