server {
	listen 80;
	root /srv;

	include /etc/nginx/mime.types;
	types {
		application/vnd.android.package-archive apk;
	}

	# The lab's public repo (Point and friends). No login.
	location /repo/ {
	}

	# Parker's own apps. F-Droid clients send the login from the repo URL.
	location /store/ {
		auth_basic "Parker's Apps";
		auth_basic_user_file /etc/nginx/htpasswd;
	}

	location / {
		return 404;
	}
}

# The app hub: one page for every app, whichever repo it lives in. hub/hub.sh writes
# /srv/hub from the two indexes. Direct downloads are links into the repos, and
# only the public repo is linked, so /store stays behind its login.
server {
	listen 80;
	server_name app.petalcat.dev;
	root /srv/hub;

	include /etc/nginx/mime.types;
	types {
		application/vnd.android.package-archive apk;
	}

	# Obtainium and browsers revalidate by ETag; Cloudflare must not keep an old APK.
	add_header Cache-Control "no-cache" always;
	add_header CDN-Cache-Control "no-store" always;
	add_header Access-Control-Allow-Origin "*" always;
	add_header Access-Control-Expose-Headers "ETag, Last-Modified, Content-Length" always;

	location = / {
		try_files /index.html =404;
	}

	location /static/ {
		alias /srv/static/;
		add_header Cache-Control "public, max-age=3600" always;
	}

	location = /api/apps {
		default_type application/json;
		try_files /api/apps.json =404;
	}

	location ~ ^/api/apps/([a-zA-Z0-9_-]+)$ {
		default_type application/json;
		try_files /api/apps/$1.json =404;
	}

	location ~ ^/apps/([a-zA-Z0-9_-]+)/download/ {
		add_header Content-Disposition 'attachment; filename="$1.apk"' always;
		add_header Cache-Control "no-cache" always;
		add_header CDN-Cache-Control "no-store" always;
		add_header Access-Control-Allow-Origin "*" always;
		add_header Access-Control-Expose-Headers "ETag, Last-Modified, Content-Length" always;
	}

	location ~ ^/apps/[a-zA-Z0-9_-]+/icon\.png$ {
	}

	location / {
		return 404;
	}
}
