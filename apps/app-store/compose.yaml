# Serves the F-Droid repos behind fdroid.petalcat.dev and the app hub behind app.petalcat.dev
# (Traefik sends both hosts to 127.0.0.1:8486).
# Deploy from a checkout of main:
#   docker compose -f apps/app-store/compose.yaml up -d
name: app-store
services:
  web:
    image: nginx@sha256:892bb2152464f0c5d8972593a5f5afaf8054552580b699d95f8ff4af08c2d33d
    container_name: fdroid-web
    restart: unless-stopped
    mem_limit: 64m
    ports: ["127.0.0.1:8486:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${PUBLIC_REPO_DIR:-/home/docker/fdroid/repo}:/srv/repo:ro
      - ${APP_STORE_DIR:-/home/docker/app-store}/repo:/srv/store/repo:ro
      - ${APP_STORE_DIR:-/home/docker/app-store}/hub:/srv/hub:ro
      - ./hub/static:/srv/static:ro
      - ${APP_STORE_DIR:-/home/docker/app-store}/htpasswd:/etc/nginx/htpasswd:ro
    logging: { driver: json-file, options: { max-size: "1m", max-file: "1" } }
