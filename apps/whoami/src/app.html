<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<script>
			// Pre-paint half of $lib/dom-injection: watch for extension-injected DOM from
			// before <body> is parsed, and only buffer until that module takes over.
			// It classifies nothing and sends nothing.
			(function () {
				var w = { t0: performance.now(), q: [], cb: null };
				w.o = new MutationObserver(function (records) {
					var t = performance.now();
					if (w.cb) w.cb(records, t);
					else w.q.push([t, records]);
				});
				w.o.observe(document.documentElement, {
					childList: true,
					subtree: true,
					attributes: true,
					attributeOldValue: true,
				});
				window.whoamiDomWatch = w;
			})();
		</script>
		<link
			rel="icon"
			href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 fill=%22%23020a06%22/><circle cx=%2216%22 cy=%2216%22 r=%229%22 fill=%22none%22 stroke=%22%234ee87a%22 stroke-width=%222%22/><circle cx=%2216%22 cy=%2216%22 r=%223%22 fill=%22%234ee87a%22/></svg>"
		/>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<title>whoami — what your browser tells the web</title>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
