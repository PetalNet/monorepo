services:
  map:
    build:
      # The Dockerfile installs from the workspace lockfile, so the build
      # context has to be the monorepo root, not this directory.
      context: ../..
      dockerfile: apps/collegemap/Dockerfile
    ports:
      - "4718:3000"
    volumes:
      - map-data:/data
    environment:
      - DATABASE_URL=file:/data/local.db
      # Signs session cookies. Generate on the host: openssl rand -base64 48
      - SESSION_SECRET=${SESSION_SECRET:?set SESSION_SECRET to sign session cookies}

volumes:
  map-data:
