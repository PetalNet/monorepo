[package]
name = "numbat-sheet-engine"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# Standalone: built only for wasm32 by the app's build:wasm script, not by the root workspace.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Mirrors upstream numbat-wasm: no network exchange-rate fetching or plotting in the browser.
numbat = { version = "1.24.0", default-features = false }
wasm-bindgen = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
