[project]
name = "janet-desk"
version = "0.1.0"
description = "Desk voice client for Janet: Home Assistant wake word and speech to text, the voice head, and spoken replies"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.9", "numpy", "pysilero-vad>=3", "sounddevice", "wyoming>=1.8,<2"]

[project.scripts]
janet-desk = "janet_desk.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["janet_desk"]

[tool.ruff]
line-length = 120
