# NOTE ON RENAMING: "courier" is a placeholder service name. To rename the
# project, see apps/courier/README.md § Renaming.
[workspace]
resolver = "3"
members = [
	"apps/box-agent",
	"apps/control-plane",
	"apps/dispatcher",
	"apps/manager",
	"apps/courier/crates/*",
	"apps/point/core",
	"apps/point/server",
]
# The Flutter bridge keeps its own lockfile and per-ABI output layout.
exclude = ["apps/point/app/rust"]

[workspace.metadata]
name = "petalnet-rust"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
futures-util = "0.3"
matrix-sdk = { version = "0.14", default-features = false, features = [
	"anyhow",
	"e2e-encryption",
	"sqlite",
	"rustls-tls",
] }
mime = "0.3"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rpassword = "7"
# Matrix SDK 0.14 fixes rusqlite to 0.37; Cargo permits one sqlite3 links version.
rusqlite = { version = "0.37", features = ["bundled"] }
serde = "1"
serde_json = "1"
serde_yaml = "0.9"
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "process", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }

courier-core = { path = "apps/courier/crates/courier-core" }
courier-relay = { path = "apps/courier/crates/courier-relay" }
courier-plugins = { path = "apps/courier/crates/courier-plugins" }
courier-ai = { path = "apps/courier/crates/courier-ai" }

[workspace.lints.rust]
warnings = { level = "deny", priority = -1 }
future-incompatible = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

clone_on_ref_ptr = "warn"
std_instead_of_core = "warn"
str_to_string = "warn"
unused_trait_names = "warn"
wildcard_enum_match_arm = "warn"

too_many_lines = "allow"
cognitive-complexity = "allow"

[profile.release]
lto = true
strip = true
