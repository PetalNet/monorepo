[project]
name = "janet-turn"
version = "0.1.0"
description = "Hears when a speaker's turn has ended: Silero VAD, a streaming speech model and a fitted judge. Shared by every Janet voice surface."
requires-python = ">=3.12"
dependencies = ["numpy>=2", "onnxruntime>=1.19"]

[tool.ruff]
line-length = 140

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["janet_turn"]

[tool.setuptools.package-data]
janet_turn = ["turn_judge.json"]

[dependency-groups]
dev = ["pytest>=8,<10"]
