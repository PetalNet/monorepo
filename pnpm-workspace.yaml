packages:
  - apps/*
  - packages/*
  - tools

# Mise bootstraps pnpm locally; pnpm/setup bootstraps it in CI. pnpm provisions Node.
# pnpm must not provision a second package manager.
pmOnFail: ignore

# Grove uses Drizzle and Better Auth's minimal runtime. Kysely and unrelated
# built-in adapters are unused.
overrides:
  "better-auth@1.7.7>@better-auth/kysely-adapter": "-"
  "better-auth@1.7.7>@better-auth/memory-adapter": "-"
  "better-auth@1.7.7>@better-auth/mongo-adapter": "-"
  "better-auth@1.7.7>@better-auth/prisma-adapter": "-"
  "better-auth@1.7.7>kysely": "-"
  "@better-auth/core@1.7.7>kysely": "-"
  vite: catalog:dev
  vitest: catalog:dev

# Why: fail installs on undeclared or incompatible peers. These package-scoped
# exceptions cover compatibility already exercised by this workspace without
# suppressing peer validation for future versions of the same dependencies.
strictPeerDependencies: true
peerDependencyRules:
  allowedVersions:
    "@napi-rs/wasm-runtime@1.2.0>@emnapi/core": ^1.9.0
    "@napi-rs/wasm-runtime@1.2.0>@emnapi/runtime": ^1.9.0
    # Better Auth's SvelteKit helper still declares Kit 2; auth boundary tests cover Kit 3.
    "better-auth@1.7.7>@sveltejs/kit": ^3.0.1

# Why: every dependency version must come from a catalog. `pnpm add` routes new
# deps into a catalog automatically and refuses to introduce a divergent range.
catalogMode: strict

# Retain the existing release-age exceptions and pnpm's default age gate.
# allowBuilds below limits dependency lifecycle scripts. Renovate separately
# waits seven days.
minimumReleaseAgeExclude:
  - eslint
  - eslint-plugin-oxlint
  - "@eslint/plugin-kit"
  - "@eslint/json"
  - "@eslint/markdown"
  - svelte
  - knip
  - "@sveltejs/kit@3.0.1"
  - effect-db@0.24.1
  - effect-qb@0.24.1
  - vite@8.3.3
  - "@effect/tsgo-darwin-arm64@0.50.0"
  - "@effect/tsgo-darwin-x64@0.50.0"
  - "@effect/tsgo-linux-arm64@0.50.0"
  - "@effect/tsgo-linux-arm@0.50.0"
  - "@effect/tsgo-linux-x64@0.50.0"
  - "@effect/tsgo-win32-arm64@0.50.0"
  - "@effect/tsgo-win32-x64@0.50.0"
  - "@effect/tsgo@0.50.0"
  - drizzle-orm@1.0.0-rc.5-5935859
  - drizzle-kit@1.0.0-rc.5-5935859

# Why: pnpm sandboxes post-install scripts by default; these have legitimate
# native-binding or codegen needs.
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  better-sqlite3: true
  esbuild: true
  msgpackr-extract: false
  prisma: true
  protobufjs: false
  puppeteer: false
  cpu-features: false
  ssh2: false

catalogs:
  dev:
    "@eslint/js": ^10.0.1
    "@eslint/json": ^2.0.0
    "@eslint/markdown": ^8.0.2
    "@manypkg/cli": ^0.25.1
    # Kit 2 apps (CollegeMap and Slide); Kit 3 consumers use the default catalog.
    "@sveltejs/adapter-node": ^5.5.7
    "@sveltejs/vite-plugin-svelte": ^7.0.0
    "@tailwindcss/vite": ^4.3.3
    "@vitest/coverage-v8": 5.0.3
    eslint-plugin-svelte: ^3.20.0
    autoprefixer: ^10.4.20
    drizzle-kit: ^0.31.8
    eslint: ^10.4.1
    # Keep the ESLint compatibility rules aligned with standalone Oxlint.
    eslint-plugin-oxlint: 1.87.0
    eslint-plugin-package-json: ^1.2.0
    impeccable: ^3.4.0
    knip: ^6.31.0
    oxfmt: 0.61.0
    oxlint: 1.87.0
    oxlint-tsgolint: 7.0.2003
    postcss: ^8.4.49
    prisma: ^5.22.0
    svelte-check: ^4.3.5
    # Keep the TS 6 API at the name ecosystem tooling imports. The native TS 7
    # compiler is installed alongside it under the official alias below.
    "@typescript/native": npm:typescript@^7.0.2
    typescript: npm:@typescript/typescript6@^6.0.2
    typescript-eslint: ^8.60.0
    typesync: ^0.14.3
    tsx: ^4.22.4
    turbo: 2.11.7
    update-ts-references: ^6.0.0
    vite: ^8.3.3
    vitest: 5.0.3
    "@stylistic/eslint-plugin": ^5.10.0

  types:
    "@types/leaflet": ^1.9.21
    "@types/leaflet.heat": ^0.2.5
    "@types/leaflet.markercluster": ^1.5.6
    "@types/node": ^25.9.1
    "@types/qrcode": ^1.5.5
    "@types/sortablejs": ^1.15.8

  prod:
    "@libsql/client": ^0.17.0
    "@lucide/svelte": ^1.23.0
    "@modelcontextprotocol/sdk": ^1.29.0
    "@prisma/client": ^5.22.0
    "@sveltejs/kit": ^2.50.1
    bcryptjs: ^3.0.0
    daisyui: ^5.6.13
    date-fns: ^4.1.0
    drizzle-orm: ^0.45.1
    leaflet: ^1.9.4
    leaflet-image: ^0.4.0
    leaflet.heat: ^0.2.0
    leaflet.markercluster: ^1.5.3
    nanoid: ^5.0.0
    qrcode: ^1.5.4
    sortablejs: ^1.15.6
    svelte: ^5.57.2
    tailwindcss: ^4.3.3
    zod: ^4.0.0

  # Apps still on Tailwind v3 (consolidated to latest v3); not upgraded to v4 yet.
  legacy:
    tailwindcss: ^3.4.17

catalog:
  "@better-auth/core": 1.7.7
  "@better-auth/test-utils": 1.7.7
  "@sveltejs/adapter-node": ^6.0.0
  "@effect/platform-node": 4.0.1
  "@effect/sql-pg": 4.0.0
  "@sveltejs/kit": 3.0.1
  "@testcontainers/postgresql": ^11.10.0
  better-auth: 1.7.7
  effect: 4.0.1
  effect-qb: 0.24.1
  mode-watcher: ^1.1.0
  "@effect/tsgo": 0.50.0
  storybook: 10.5.10
  "@storybook/svelte-vite": 10.5.10
  "@storybook/addon-a11y": 10.5.10
  "@storybook/addon-docs": 10.5.10
  jose: ^6.2.5
  "@modelcontextprotocol/client": 2.0.0
  "@better-auth/mcp": 1.7.7
  "@effect/vitest": 4.0.1
  drizzle-orm: 1.0.0-rc.5-5935859
  drizzle-kit: 1.0.0-rc.5-5935859
# Kit's programmatic API requires a matching ORM installation.
packageExtensions:
  "drizzle-kit@1.0.0-rc.5-5935859":
    dependencies:
      drizzle-orm: 1.0.0-rc.5-5935859
# Keep JWKS network TypeErrors distinct from opaque-token failures (503, not 401).
# Covered by Grove's real HTTP JWKS disconnect regression; remove after an upstream fix.
patchedDependencies:
  "@better-auth/core@1.7.7": patches/@better-auth__core@1.7.7.patch
  drizzle-orm@1.0.0-rc.5-5935859: patches/drizzle-orm@1.0.0-rc.5-5935859.patch
