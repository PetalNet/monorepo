name: Setup
description: Check out the repository and install pinned pnpm, Node, and frozen dependencies.

inputs:
  fetch-depth:
    description: Git history depth (0 for affected planning and execution).
    default: "1"
    required: false

runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: ${{ inputs.fetch-depth }}
        persist-credentials: false
    - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
      with:
        cache: true
        require-lockfile: true
