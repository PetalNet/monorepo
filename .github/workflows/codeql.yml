name: codeql

on:
  workflow_call:
    inputs:
      language:
        type: string
        required: true

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ inputs.language }})
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-codeql-${{ inputs.language }}
      cancel-in-progress: true
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: inputs.language == 'rust'
        name: Install repository-pinned Rust toolchain
        run: rustup toolchain install
      - if: inputs.language == 'rust'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # CodeQL's none mode still compiles build scripts and procedural macros.
          workspaces: . -> target
          prefix-key: codeql-rust
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ inputs.language }}
          build-mode: none
          queries: security-extended
          config: >-
            ${{ inputs.language == 'javascript-typescript' && 'paths: [".", "apps/storybook/.storybook", "apps/grove/src/routes/.well-known"]' || '' }}
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ inputs.language }}
