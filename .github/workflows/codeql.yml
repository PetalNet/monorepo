name: codeql

on:
  workflow_call:
    inputs:
      language:
        type: string
        required: true
      shard:
        description: Rust crate group; selects .github/codeql/rust-<shard>.yml and its own SARIF category.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ inputs.language }}${{ inputs.shard && format(' {0}', inputs.shard) || '' }})
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-codeql-${{ inputs.language }}-${{ inputs.shard }}
      cancel-in-progress: true
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: inputs.language == 'rust'
        name: Install repository-pinned Rust toolchain
        run: rustup toolchain install
      - if: inputs.language == 'rust'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # CodeQL's none mode still compiles build scripts and procedural macros.
          workspaces: . -> target
          prefix-key: codeql-rust
          shared-key: ${{ inputs.shard }}
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ inputs.language }}
          build-mode: none
          config-file: ${{ inputs.shard && format('.github/codeql/{0}-{1}.yml', inputs.language, inputs.shard) || '' }}
          queries: security-extended
          config: >-
            ${{ inputs.language == 'javascript-typescript' && 'paths: [".", "apps/storybook/.storybook", "apps/grove/src/routes/.well-known"]' || '' }}
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ inputs.language }}${{ inputs.shard && format('/shard:{0}', inputs.shard) || '' }}
