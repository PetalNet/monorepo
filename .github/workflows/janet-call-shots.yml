name: janet-call-shots

# Throwaway: renders the current screens for the redesign's fault list. Never merged.
on:
  push:
    branches: ["shots/**"]

permissions:
  contents: read

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/janet-call-android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      - run: ./gradlew --no-daemon testDebugUnitTest --tests '*Shots*'
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shots
          path: |
            apps/janet-call-android/build/shots
            apps/janet-call-android/build/test-results
          retention-days: 3
