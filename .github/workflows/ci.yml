name: ci
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  TURBO_TELEMETRY_DISABLED: "1"

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      manager-rust: ${{ steps.select.outputs.manager-rust }}
      courier-rust: ${{ steps.select.outputs.courier-rust }}
      dispatcher-rust: ${{ steps.select.outputs.dispatcher-rust }}
      control-plane-rust: ${{ steps.select.outputs.control-plane-rust }}
      box-agent-rust: ${{ steps.select.outputs.box-agent-rust }}
      point: ${{ steps.select.outputs.point }}
      rust: ${{ steps.select.outputs.rust }}
      js: ${{ steps.select.outputs.js }}
      base: ${{ steps.select.outputs.base }}
      affected: ${{ steps.select.outputs.affected }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true
      - id: select
        run: pnpm exec node tools/ci-manager.mjs select

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true
      - uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1
        with:
          cache-prefix: turbo-${{ runner.os }}-${{ runner.arch }}-
          use-relative-cache-path: true
      - run: pnpm check

  test:
    needs: select
    if: needs.select.outputs.js == 'true'
    runs-on: ubuntu-latest
    env:
      TURBO_SCM_BASE: ${{ needs.select.outputs.base }}
      TURBO_SCM_HEAD: HEAD
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true
      - uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1
        with:
          cache-prefix: turbo-${{ runner.os }}-${{ runner.arch }}-
          use-relative-cache-path: true
      - if: needs.select.outputs.affected == 'true'
        run: pnpm test --affected
      - if: needs.select.outputs.affected != 'true'
        run: pnpm test

  build:
    needs: select
    if: needs.select.outputs.js == 'true'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:/tmp/build.db"
      TURBO_SCM_BASE: ${{ needs.select.outputs.base }}
      TURBO_SCM_HEAD: HEAD
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true
      - uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1
        with:
          cache-prefix: turbo-${{ runner.os }}-${{ runner.arch }}-
          use-relative-cache-path: true
      - name: Write app env
        run: |
          echo "DATABASE_URL=$DATABASE_URL" > apps/collegemap/.env
          echo "DATABASE_URL=$DATABASE_URL" > apps/grove/.env
      - if: needs.select.outputs.affected == 'true'
        run: pnpm build --affected
      - if: needs.select.outputs.affected != 'true'
        run: pnpm build

  manager-rust:
    needs: select
    if: needs.select.outputs.manager-rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tmux
        run: sudo apt-get update -q && sudo apt-get install -y -q tmux && tmux -V
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup component add rustfmt clippy
      - run: cargo fmt -p agent-manager --check
      - run: cargo clippy -p agent-manager --all-targets --locked -- -D warnings
      - run: cargo test -p agent-manager --locked
      - name: tmux integration tests (scratch sockets only)
        run: N12_TMUX_IT=1 cargo test -p agent-manager --locked --test tmux_it -- --ignored

  courier-rust:
    needs: select
    if: needs.select.outputs.courier-rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system build dependencies
        run: sudo apt-get update -q && sudo apt-get install -y -q libsqlite3-dev pkg-config libssl-dev
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup component add rustfmt clippy
      # cargo fmt requires exact package names rather than Cargo's package globs.
      - run: cargo fmt -p courier -p courier-ai -p courier-core -p courier-plugins -p courier-relay --check
      - run: cargo clippy -p 'courier*' --all-targets --locked -- -W clippy::pedantic -D warnings
      - run: cargo build -p 'courier*' --all-targets --locked
      - run: cargo test -p 'courier*' --locked

  dispatcher-rust:
    needs: select
    if: needs.select.outputs.dispatcher-rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup component add rustfmt clippy
      - run: cargo fmt -p dispatcher --check
      - run: cargo clippy -p dispatcher --all-targets --locked -- -D warnings
      - run: cargo test -p dispatcher --locked

  control-plane-rust:
    needs: select
    if: needs.select.outputs.control-plane-rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup component add rustfmt clippy
      - run: cargo fmt -p control-plane --check
      - run: cargo clippy -p control-plane --all-targets --locked -- -D warnings
      - run: cargo test -p control-plane --locked

  box-agent-rust:
    needs: select
    if: needs.select.outputs.box-agent-rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup component add rustfmt clippy
      - run: cargo fmt -p box-agent --check
      - run: cargo clippy -p box-agent --all-targets --locked -- -D warnings
      - run: cargo test -p box-agent --locked

  point:
    needs: select
    if: needs.select.outputs.point == 'true'
    uses: ./.github/workflows/point.yml # zizmor: ignore[self-repository] actionlint compatibility

  zizmor:
    timeout-minutes: 2
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@192e21d79ab29983730a13d1382995c2307fbcaa # v0.5.7
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql-other:
    if: vars.CODEQL_ADVANCED == 'true'
    uses: ./.github/workflows/codeql.yml # zizmor: ignore[self-repository] actionlint compatibility
    with:
      languages: '["javascript-typescript", "actions", "python"]'
    permissions:
      contents: read
      security-events: write

  codeql-rust:
    needs: select
    if: vars.CODEQL_ADVANCED == 'true' && needs.select.outputs.rust == 'true'
    uses: ./.github/workflows/codeql.yml # zizmor: ignore[self-repository] actionlint compatibility
    with:
      languages: '["rust"]'
    permissions:
      contents: read
      security-events: write

  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: crate-ci/typos@bee27e3a4fd1ea2111cf90ab89cd076c870fce14 # v1.48.0

  link-check:
    timeout-minutes: 2
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --cache --max-cache-age 1d .
          token: ${{ github.token }}

  finish:
    if: always()
    needs:
      - select
      - check
      - test
      - build
      - manager-rust
      - courier-rust
      - dispatcher-rust
      - control-plane-rust
      - box-agent-rust
      - point
      - zizmor
      - codeql-other
      - codeql-rust
      - typos
      - link-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          install: false
      - name: Require exactly the selected job conclusions
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          CODEQL_ADVANCED: ${{ vars.CODEQL_ADVANCED == 'true' && 'true' || 'false' }}
        run: pnpm --config.verifyDepsBeforeRun=false exec node tools/ci-manager.mjs gate
