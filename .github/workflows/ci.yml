name: ci
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  TURBO_TELEMETRY_DISABLED: "1"
  # Every JS job installs frozen dependencies through the setup action first.
  PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      manager-rust: ${{ steps.select.outputs.manager-rust }}
      courier-rust: ${{ steps.select.outputs.courier-rust }}
      dispatcher-rust: ${{ steps.select.outputs.dispatcher-rust }}
      control-plane-rust: ${{ steps.select.outputs.control-plane-rust }}
      box-agent-rust: ${{ steps.select.outputs.box-agent-rust }}
      point: ${{ steps.select.outputs.point }}
      point-rust: ${{ steps.select.outputs.point-rust }}
      rust: ${{ steps.select.outputs.rust }}
      js: ${{ steps.select.outputs.js }}
      build: ${{ steps.select.outputs.build }}
      test: ${{ steps.select.outputs.test }}
      js-packages: ${{ steps.select.outputs.js-packages }}
      actions: ${{ steps.select.outputs.actions }}
      codeql-js: ${{ steps.select.outputs.codeql-js }}
      codeql-python: ${{ steps.select.outputs.codeql-python }}
      affected: ${{ steps.select.outputs.affected }}
    steps:
      - uses: $/.github/actions/setup
        with:
          fetch-depth: 0
      - uses: $/.github/actions/setup-turbo
      - id: select
        run: pnpm ci-manager select

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: $/.github/actions/setup
      - uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1
        with:
          cache-prefix: turbo-${{ runner.os }}-${{ runner.arch }}-
          use-relative-cache-path: true
      - run: pnpm check

  test:
    needs: select
    if: needs.select.outputs.test == 'true'
    runs-on: ubuntu-latest
    env:
      JS_PACKAGES_JSON: ${{ needs.select.outputs.js-packages }}
    steps:
      - uses: $/.github/actions/setup
      - uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1
        with:
          cache-prefix: turbo-${{ runner.os }}-${{ runner.arch }}-
          use-relative-cache-path: true
      - if: needs.select.outputs.affected == 'true'
        run: pnpm ci-manager test
      - if: needs.select.outputs.affected != 'true'
        run: pnpm test

  build:
    needs: select
    if: needs.select.outputs.build == 'true'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:/tmp/build.db"
      JS_PACKAGES_JSON: ${{ needs.select.outputs.js-packages }}
    steps:
      - uses: $/.github/actions/setup
      - uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1
        with:
          cache-prefix: turbo-${{ runner.os }}-${{ runner.arch }}-
          use-relative-cache-path: true
      - name: Write app env
        run: |
          echo "DATABASE_URL=$DATABASE_URL" > apps/collegemap/.env
          echo "DATABASE_URL=$DATABASE_URL" > apps/grove/.env
      - if: needs.select.outputs.affected == 'true'
        run: pnpm ci-manager build
      - if: needs.select.outputs.affected != 'true'
        run: pnpm build

  manager-rust:
    needs: select
    if: needs.select.outputs.manager-rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tmux
        run: sudo apt-get update -q && sudo apt-get install -y -q tmux && tmux -V
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup component add rustfmt clippy
      - uses: $/.github/actions/setup-turbo
      - parallel:
          - run: turbo --skip-infer run fmt:check check lint test --filter=agent-manager
          - name: tmux integration tests (scratch sockets only)
            env:
              N12_TMUX_IT: "1"
            run: turbo --skip-infer run test:tmux --filter=agent-manager

  courier-rust:
    needs: select
    if: needs.select.outputs.courier-rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system build dependencies
        run: sudo apt-get update -q && sudo apt-get install -y -q libsqlite3-dev pkg-config libssl-dev
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup component add rustfmt clippy
      - uses: $/.github/actions/setup-turbo
      - run: turbo --skip-infer run fmt:check check lint build test --filter='courier*'

  dispatcher-rust:
    needs: select
    if: needs.select.outputs.dispatcher-rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup component add rustfmt clippy
      - uses: $/.github/actions/setup-turbo
      - run: turbo --skip-infer run fmt:check check lint test --filter=dispatcher

  control-plane-rust:
    needs: select
    if: needs.select.outputs.control-plane-rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup component add rustfmt clippy
      - uses: $/.github/actions/setup-turbo
      - run: turbo --skip-infer run fmt:check check lint test --filter=control-plane

  box-agent-rust:
    needs: select
    if: needs.select.outputs.box-agent-rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup component add rustfmt clippy
      - uses: $/.github/actions/setup-turbo
      - run: turbo --skip-infer run fmt:check check lint test --filter=box-agent

  point:
    needs: select
    if: needs.select.outputs.point == 'true'
    uses: $/.github/workflows/point.yml
    with:
      skip-rust: ${{ needs.select.outputs.point-rust == 'false' }}

  zizmor:
    timeout-minutes: 2
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql-js:
    needs: select
    if: needs.select.outputs.codeql-js == 'true'
    uses: $/.github/workflows/codeql.yml
    with:
      language: javascript-typescript
    permissions:
      contents: read
      security-events: write

  codeql-python:
    needs: select
    if: needs.select.outputs.codeql-python == 'true'
    uses: $/.github/workflows/codeql.yml
    with:
      language: python
    permissions:
      contents: read
      security-events: write

  codeql-actions:
    needs: select
    if: needs.select.outputs.actions == 'true'
    uses: $/.github/workflows/codeql.yml
    with:
      language: actions
    permissions:
      contents: read
      security-events: write

  codeql-rust:
    needs: select
    if: needs.select.outputs.rust == 'true'
    uses: $/.github/workflows/codeql.yml
    with:
      language: rust
    permissions:
      contents: read
      security-events: write

  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: crate-ci/typos@bee27e3a4fd1ea2111cf90ab89cd076c870fce14 # v1.48.0

  link-check:
    timeout-minutes: 2
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --cache --max-cache-age 1d .
          token: ${{ github.token }}

  finish:
    if: always()
    needs:
      - select
      - check
      - test
      - build
      - manager-rust
      - courier-rust
      - dispatcher-rust
      - control-plane-rust
      - box-agent-rust
      - point
      - zizmor
      - codeql-js
      - codeql-python
      - codeql-actions
      - codeql-rust
      - typos
      - link-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: $/.github/actions/setup
      - name: Require exactly the selected job conclusions
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: pnpm ci-manager gate
