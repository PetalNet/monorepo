name: ci
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  TURBO_TELEMETRY_DISABLED: "1"
  # Every JS job installs frozen dependencies through the setup action first.
  PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      manager-rust: ${{ steps.select.outputs.manager-rust }}
      courier-rust: ${{ steps.select.outputs.courier-rust }}
      dispatcher-rust: ${{ steps.select.outputs.dispatcher-rust }}
      control-plane-rust: ${{ steps.select.outputs.control-plane-rust }}
      box-agent-rust: ${{ steps.select.outputs.box-agent-rust }}
      point: ${{ steps.select.outputs.point }}
      rust: ${{ steps.select.outputs.rust }}
      js: ${{ steps.select.outputs.js }}
      base: ${{ steps.select.outputs.base }}
      actions: ${{ steps.select.outputs.actions }}
      codeql-js: ${{ steps.select.outputs.codeql-js }}
      codeql-python: ${{ steps.select.outputs.codeql-python }}
      affected: ${{ steps.select.outputs.affected }}
    steps:
      - uses: $/.github/actions/setup
        with:
          fetch-depth: 0
      - name: Install pinned toolchain for Cargo package discovery
        run: rustup toolchain install
      - id: select
        run: pnpm ci-manager select

  root-check:
    runs-on: ubuntu-latest
    steps:
      - uses: $/.github/actions/setup
      - uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e # v2.5.2
        with:
          cache-prefix: turbo-${{ runner.os }}-${{ runner.arch }}-
          use-relative-cache-path: true
      - run: pnpm check:root

  check:
    needs: select
    if: needs.select.outputs.js == 'true'
    runs-on: ubuntu-latest
    env:
      TURBO_SCM_BASE: ${{ needs.select.outputs.base }}
      TURBO_SCM_HEAD: HEAD
    steps:
      - uses: $/.github/actions/setup
        with:
          fetch-depth: 0
      - uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e # v2.5.2
        with:
          cache-prefix: turbo-${{ runner.os }}-${{ runner.arch }}-
          use-relative-cache-path: true
      - if: needs.select.outputs.affected == 'true'
        run: pnpm check:packages --affected
      - if: needs.select.outputs.affected != 'true'
        run: pnpm check:packages

  test:
    needs: select
    if: needs.select.outputs.js == 'true'
    runs-on: ubuntu-latest
    env:
      TURBO_SCM_BASE: ${{ needs.select.outputs.base }}
      TURBO_SCM_HEAD: HEAD
    steps:
      - uses: $/.github/actions/setup
        with:
          fetch-depth: 0
      - uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e # v2.5.2
        with:
          cache-prefix: turbo-${{ runner.os }}-${{ runner.arch }}-
          use-relative-cache-path: true
      # The PDF, OCR and browser controls need system tools; install them only
      # when vault-cite or its dependencies change, to save CI minutes.
      - id: vault
        env:
          AFFECTED: ${{ needs.select.outputs.affected }}
          BASE: ${{ needs.select.outputs.base }}
        run: |
          if [ "$AFFECTED" != "true" ] || ! git diff --quiet "$BASE" HEAD -- packages/vault-cite pnpm-lock.yaml pnpm-workspace.yaml .github/workflows/ci.yml; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install vault extraction tools
        if: steps.vault.outputs.run == 'true'
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils tesseract-ocr tesseract-ocr-eng
      - name: Install vault test browser
        if: steps.vault.outputs.run == 'true'
        run: pnpm --filter @petalnet/vault-cite exec playwright install --with-deps chromium
      - name: Run vault PDF and OCR tests without task caching
        if: steps.vault.outputs.run == 'true'
        env:
          CITE_BROWSER_TESTS: "1"
        run: |
          command -v pdfinfo pdftotext pdftoppm tesseract
          pnpm --filter @petalnet/vault-cite test --reporter=verbose
      - if: needs.select.outputs.affected == 'true'
        run: pnpm test --affected
      - if: needs.select.outputs.affected != 'true'
        run: pnpm test

  build:
    needs: select
    if: needs.select.outputs.js == 'true'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:/tmp/build.db"
      TURBO_SCM_BASE: ${{ needs.select.outputs.base }}
      TURBO_SCM_HEAD: HEAD
    steps:
      - uses: $/.github/actions/setup
        with:
          fetch-depth: 0
      - uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e # v2.5.2
        with:
          cache-prefix: turbo-${{ runner.os }}-${{ runner.arch }}-
          use-relative-cache-path: true
      - if: needs.select.outputs.affected == 'true'
        run: pnpm build --affected
      - if: needs.select.outputs.affected != 'true'
        run: pnpm build

  manager-rust:
    needs: select
    if: needs.select.outputs.manager-rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tmux
        run: sudo apt-get update -q && sudo apt-get install -y -q tmux && tmux -V
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup component add rustfmt clippy
      - uses: $/.github/actions/setup-turbo
      - parallel:
          - run: turbo --skip-infer run fmt:check check lint test --filter=agent-manager
          - name: tmux integration tests (scratch sockets only)
            env:
              N12_TMUX_IT: "1"
            run: turbo --skip-infer run test:tmux --filter=agent-manager

  courier-rust:
    needs: select
    if: needs.select.outputs.courier-rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system build dependencies
        run: sudo apt-get update -q && sudo apt-get install -y -q libsqlite3-dev pkg-config libssl-dev
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup component add rustfmt clippy
      - uses: $/.github/actions/setup-turbo
      - run: turbo --skip-infer run fmt:check check lint build test --filter='courier*'

  dispatcher-rust:
    needs: select
    if: needs.select.outputs.dispatcher-rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup component add rustfmt clippy
      - uses: $/.github/actions/setup-turbo
      - run: turbo --skip-infer run fmt:check check lint test --filter=dispatcher

  control-plane-rust:
    needs: select
    if: needs.select.outputs.control-plane-rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup component add rustfmt clippy
      - uses: $/.github/actions/setup-turbo
      - run: turbo --skip-infer run fmt:check check lint test --filter=control-plane

  box-agent-rust:
    needs: select
    if: needs.select.outputs.box-agent-rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup component add rustfmt clippy
      - uses: $/.github/actions/setup-turbo
      - run: turbo --skip-infer run fmt:check check lint test --filter=box-agent

  point:
    needs: select
    if: needs.select.outputs.point == 'true'
    uses: $/.github/workflows/point.yml

  zizmor:
    timeout-minutes: 2
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql-js:
    needs: select
    if: needs.select.outputs.codeql-js == 'true'
    uses: $/.github/workflows/codeql.yml
    with:
      language: javascript-typescript
    permissions:
      contents: read
      security-events: write

  codeql-python:
    needs: select
    if: needs.select.outputs.codeql-python == 'true'
    uses: $/.github/workflows/codeql.yml
    with:
      language: python
    permissions:
      contents: read
      security-events: write

  codeql-actions:
    needs: select
    if: needs.select.outputs.actions == 'true'
    uses: $/.github/workflows/codeql.yml
    with:
      language: actions
    permissions:
      contents: read
      security-events: write

  codeql-rust:
    needs: select
    if: needs.select.outputs.rust == 'true'
    uses: $/.github/workflows/codeql.yml
    with:
      language: rust
    permissions:
      contents: read
      security-events: write

  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1

  link-check:
    timeout-minutes: 2
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --cache --max-cache-age 1d .
          token: ${{ github.token }}

  finish:
    if: always()
    needs:
      - select
      - root-check
      - check
      - test
      - build
      - manager-rust
      - courier-rust
      - dispatcher-rust
      - control-plane-rust
      - box-agent-rust
      - point
      - zizmor
      - codeql-js
      - codeql-python
      - codeql-actions
      - codeql-rust
      - typos
      - link-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: $/.github/actions/setup
      - name: Require exactly the selected job conclusions
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: pnpm ci-manager gate
