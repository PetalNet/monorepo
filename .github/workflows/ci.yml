name: ci
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  TURBO_TELEMETRY_DISABLED: "1"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true
      - uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1
        with:
          cache-prefix: turbo-${{ runner.os }}-${{ runner.arch }}-
          use-relative-cache-path: true
      - run: pnpm check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true
      - uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1
        with:
          cache-prefix: turbo-${{ runner.os }}-${{ runner.arch }}-
          use-relative-cache-path: true
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:/tmp/build.db"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true
      - uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1
        with:
          cache-prefix: turbo-${{ runner.os }}-${{ runner.arch }}-
          use-relative-cache-path: true
      - name: Write app env
        run: |
          echo "DATABASE_URL=$DATABASE_URL" > apps/collegemap/.env
          echo "DATABASE_URL=$DATABASE_URL" > apps/grove/.env
      - run: pnpm build

  manager-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tmux
        run: sudo apt-get update -q && sudo apt-get install -y -q tmux && tmux -V
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup component add rustfmt clippy
      - run: cargo fmt -p agent-manager --check
      - run: cargo clippy -p agent-manager --all-targets --locked -- -D warnings
      - run: cargo test -p agent-manager --locked
      - name: tmux integration tests (scratch sockets only)
        run: N12_TMUX_IT=1 cargo test -p agent-manager --locked --test tmux_it -- --ignored

  courier-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system build dependencies
        run: sudo apt-get update -q && sudo apt-get install -y -q libsqlite3-dev pkg-config libssl-dev
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup component add rustfmt clippy
      # cargo fmt requires exact package names rather than Cargo's package globs.
      - run: cargo fmt -p courier -p courier-ai -p courier-core -p courier-plugins -p courier-relay --check
      - run: cargo clippy -p 'courier*' --all-targets --locked -- -W clippy::pedantic -D warnings
      - run: cargo build -p 'courier*' --all-targets --locked
      - run: cargo test -p 'courier*' --locked

  dispatcher-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup component add rustfmt clippy
      - run: cargo fmt -p dispatcher --check
      - run: cargo clippy -p dispatcher --all-targets --locked -- -D warnings
      - run: cargo test -p dispatcher --locked

  control-plane-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup component add rustfmt clippy
      - run: cargo fmt -p control-plane --check
      - run: cargo clippy -p control-plane --all-targets --locked -- -D warnings
      - run: cargo test -p control-plane --locked

  box-agent-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup component add rustfmt clippy
      - run: cargo fmt -p box-agent --check
      - run: cargo clippy -p box-agent --all-targets --locked -- -D warnings
      - run: cargo test -p box-agent --locked

  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: crate-ci/typos@bee27e3a4fd1ea2111cf90ab89cd076c870fce14 # v1.48.0

  link-check:
    timeout-minutes: 2
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --cache --max-cache-age 1d .
          token: ${{ github.token }}

  hey-janet-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true
      - run: pnpm --filter @petalnet/hey-janet exec playwright install --with-deps chromium webkit firefox
      - name: Provide headless audio output for Firefox
        run: |
          sudo apt-get install -y -q pulseaudio
          pulseaudio --start --exit-idle-time=-1 --load="module-null-sink sink_name=hey_janet_test"
      - run: pnpm --filter @petalnet/hey-janet build
      - run: pnpm --filter @petalnet/hey-janet test:e2e
