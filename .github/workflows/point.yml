name: point

on:
  workflow_call:
    inputs:
      skip-rust:
        description: Skip the Rust checks when every Turbo task is cached.
        type: boolean
        default: false
  workflow_dispatch:

env:
  CI: true
  TURBO_TELEMETRY_DISABLED: "1"
  PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-point
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    permissions:
      contents: read
      id-token: write
    name: rust (fmt, clippy, build, test)
    if: ${{ !inputs.skip-rust }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: point
          POSTGRES_PASSWORD: point
          POSTGRES_DB: point_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U point"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://point:point@localhost:5432/point_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
      - uses: $/.github/actions/setup-turbo
      - run: turbo --skip-infer run fmt:check check lint build test --filter='point-*'

  flutter:
    name: flutter (analyze, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Check for Flutter project
        id: check
        run: |
          if [ -f apps/point/app/pubspec.yaml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "apps/point/app has no Flutter project yet (lands in M1) — skipping honestly."
          fi
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        if: steps.check.outputs.present == 'true'
        with:
          channel: stable
          # Pin to the version the client is built + verified against (kaisel
          # 0.22.0 needs Dart 3.10+; this ships Dart 3.12).
          flutter-version: 3.44.6
      - name: flutter pub get
        if: steps.check.outputs.present == 'true'
        run: flutter pub get
        working-directory: apps/point/app
      - name: flutter analyze
        if: steps.check.outputs.present == 'true'
        run: flutter analyze
        working-directory: apps/point/app
      - name: build desktop MLS test bridge
        if: steps.check.outputs.present == 'true'
        run: cargo build --manifest-path rust/Cargo.toml --locked --release
        working-directory: apps/point/app
      - name: flutter test
        if: steps.check.outputs.present == 'true'
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/apps/point/app/rust/target/release
        run: |
          if [ -d test ]; then flutter test; else echo "no tests yet"; fi
        working-directory: apps/point/app
