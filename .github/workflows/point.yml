name: point

on:
  workflow_call:
  workflow_dispatch:

env:
  CI: true
  TURBO_TELEMETRY_DISABLED: "1"
  PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-point
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    permissions:
      contents: read
      id-token: write
    name: rust (fmt, clippy, build, test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          POSTGRES_USER: point
          POSTGRES_PASSWORD: point
          POSTGRES_DB: point_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U point"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://point:point@localhost:5432/point_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-cache keys on every installed toolchain, and the image's own stable differs between
      # runner image versions.
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain uninstall stable && rustup toolchain install && rustup component add rustfmt clippy
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-nextest@0.9.152
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: . -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: $/.github/actions/setup-turbo
      - run: turbo --skip-infer run fmt:check check lint build test --filter='point-*'

  flutter-analyze:
    name: flutter (analyze)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          # Pin to the version the client is built + verified against (kaisel
          # 0.22.0 needs Dart 3.10+; this ships Dart 3.12).
          flutter-version: 3.44.6
      - run: flutter pub get
        working-directory: apps/point/app
      - run: flutter analyze
        working-directory: apps/point/app

  flutter-test:
    name: flutter (test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      # The desktop MLS bridge compiles while the Flutter SDK downloads.
      - name: Start desktop MLS test bridge build
        run: |
          nohup cargo build --manifest-path rust/Cargo.toml --locked --release > "$RUNNER_TEMP/bridge.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/bridge.pid"
        working-directory: apps/point/app
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.44.6
      # `flutter test` runs webcrypto's native-assets hook, which compiles BoringSSL (about two
      # minutes). Cache the built library with the package source: the hook rebuilds when a source
      # file is newer than its output, so both must restore together. The key follows the lockfile.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.pub-cache/hosted/pub.dev/webcrypto-*
            ~/.pub-cache/hosted-hashes/pub.dev/webcrypto-*
            apps/point/app/.dart_tool/hooks_runner/shared/webcrypto
          key: flutter-webcrypto-hook-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/point/app/pubspec.lock') }}
      - run: flutter pub get
        working-directory: apps/point/app
      - name: Wait for desktop MLS test bridge
        run: |
          timeout 600 tail --pid="$(cat "$RUNNER_TEMP/bridge.pid")" -f /dev/null
          cat "$RUNNER_TEMP/bridge.log"
          test -f rust/target/release/libpoint_mls.so
        working-directory: apps/point/app
      # test/all.dart imports every suite so `flutter test` compiles and boots one isolate
      # instead of one per file (flutter/flutter#90225). It is generated; CI fails if stale.
      - name: Check test/all.dart is up to date
        run: dart run tool/gen_all_test.dart --check
        working-directory: apps/point/app
      - name: flutter test
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/apps/point/app/rust/target/release
        run: time flutter test test/all.dart
        working-directory: apps/point/app
