name: janet-dictate
on:
  pull_request:
    paths:
      - apps/janet-dictate/**
      - packages/janet-turn/**
      - .github/workflows/janet-dictate.yml
  push:
    branches: [main]
    paths:
      - apps/janet-dictate/**
      - packages/janet-turn/**
      - .github/workflows/janet-dictate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install decoder and endpoint
        run: |
          python3 -m venv /tmp/dictate-env
          /tmp/dictate-env/bin/pip install ./packages/janet-turn ./apps/janet-dictate
      - name: Exercise WebSocket protocol
        run: /tmp/dictate-env/bin/python -m unittest discover -s apps/janet-dictate/tests -v
