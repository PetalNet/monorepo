name: codeql-full

on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    uses: $/.github/workflows/codeql.yml
    permissions:
      contents: read
      security-events: write
    with:
      languages: '["javascript-typescript", "actions", "python", "rust"]'
