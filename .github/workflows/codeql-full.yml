name: codeql-full

on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions, python, rust]
    uses: $/.github/workflows/codeql.yml
    permissions:
      contents: read
      security-events: write
    with:
      language: ${{ matrix.language }}
